[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom_tc"
version = "5.0.0.0"
description = "Python library for TouchNetix aXiom Touch Controllers"
license = "MIT"
readme = "README.md"
authors = [
    { name="Mark Satterthwaite", email="mark.satterthwaite@touchnetix.com"},
    { name="James Cameron", email="james.cameron@touchnetix.com"},
    { name="Andrew Thomas", email="andrew.thomas@touchnetix.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"

# 1. REMOVE "axiom_usages" from dependencies. 
# It is now internal code, not an external download.
dependencies = [
    # Add any dependencies that axiom_usages itself requires here 
    # so they are installed when axiom_tc is installed.
]

[tool.setuptools]
# 2. Explicitly include the submodule directory in the build
packages = ["axiom_tc", "axiom_usages"]

[tool.setuptools.package-data]
# Ensure non-python files (like VERSION or README) inside the submodule are included
"*" = ["*.txt", "*.md"]